<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>FanSlayer · vista previa (solo desarrollo)</title>
    <script>
      // Aplica tema e idioma guardados (o los del sistema) antes de pintar, para no parpadear.
      (function () {
        var r = document.documentElement
        try {
          var t = localStorage.getItem('fanslayer:theme')
          var l = localStorage.getItem('fanslayer:lang')
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        if (l !== 'es' && l !== 'en') l = (navigator.language || 'es').toLowerCase().indexOf('en') === 0 ? 'en' : 'es'
        r.dataset.theme = t
        r.style.colorScheme = t
        r.lang = l
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/dev/preview.jsx"></script>
  </body>
</html>
