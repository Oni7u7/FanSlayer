    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FanSlayer: defiende el escenario</title>
    <meta name="description" content="Juego web pixel art en Monad Testnet. Compra a tu artista como NFT y aguanta oleadas de zombis en el escenario." />
    <meta name="theme-color" content="#09090b" />
    <script>
      // Aplica tema e idioma guardados (o los del sistema) antes de pintar, para no parpadear.
      (function () {
        var r = document.documentElement
        try {
          var t = localStorage.getItem('fanslayer:theme')
          var l = localStorage.getItem('fanslayer:lang')
        } catch (e) {}
        // ?theme=light|dark y ?lang=es|en ganan (útil para compartir un enlace en inglés o en claro)
        try {
          var q = new URLSearchParams(location.search)
          if (q.get('theme') === 'light' || q.get('theme') === 'dark') t = q.get('theme')
          if (q.get('lang') === 'es' || q.get('lang') === 'en') l = q.get('lang')
        } catch (e) {}
        // Oscuro por defecto (identidad brutalism/cybercore); el claro queda guardado si el usuario lo elige
        if (t !== 'light' && t !== 'dark') t = 'dark'
        if (l !== 'es' && l !== 'en') l = (navigator.language || 'es').toLowerCase().indexOf('en') === 0 ? 'en' : 'es'
        r.dataset.theme = t
        r.style.colorScheme = t
        r.lang = l
      })()
    </script>
